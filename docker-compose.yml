services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-teatrope}
      MYSQL_USER: ${MYSQL_USER:-teatrope}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-teatrope}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    command: ["mysqld", "--default-authentication-plugin=mysql_native_password", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: ./backend
      dockerfile: docker/docker_files/Dockerfile
    env_file:
      - .env
    environment:
      MYSQL_HOST: db
    volumes:
      - ./backend:/code
    ports:
      - "8001:8001"
    depends_on:
      - db
    entrypoint: ["sh", "/code/docker/entrypoints/entrypoint.sh"]
    command: python manage.py runserver 0.0.0.0:8001

volumes:
  db_data:

